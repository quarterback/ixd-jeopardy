# No build step. Netlify serves the folder as is and bundles the one function.
[build]
  publish = "."
  command = ""

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "/play"
  to = "/play.html"
  status = 200

[[redirects]]
  from = "/watch"
  to = "/watch.html"
  status = 200
